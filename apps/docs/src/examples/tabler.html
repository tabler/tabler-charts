<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/charts-bootstrap/dist/tabler.css">

<div class="card">

    <div data-tc-chart="line" data-tc-aspect-ratio="2.6" data-tc-y='{"format":{"notation":"compact"}}'

  </div>
</div>
