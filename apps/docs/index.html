<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Zero-dependency SVG charts styled with CSS." />
    <title>Tabler Charts — Playground</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem('tc-docs-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header-inner">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 17l5-6 4 3 6-8 3 3" />
          </svg>
          Tabler Charts
          <span class="badge">preview</span>
        </a>
        <fieldset class="theme-switch" aria-label="Color theme">
          <button type="button" data-theme-choice="auto">Auto</button>
          <button type="button" data-theme-choice="light">Light</button>
          <button type="button" data-theme-choice="dark">Dark</button>
        </fieldset>
      </div>
    </header>

    <main class="container">
      <section class="intro">
        <h1>Zero-dependency SVG charts, styled with CSS</h1>
        <p>
          Work-in-progress playground. Every demo below renders with the current
          <code>main</code> branch of <code>@tabler/charts</code>.
        </p>
      </section>
      <div id="demos" class="demos"></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
