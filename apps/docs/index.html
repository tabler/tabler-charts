<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Tabler Charts</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f8fb; --fg: #182433; --muted: #6b7a90; }
      @media (prefers-color-scheme: dark) { :root { --bg: #151f2c; --fg: #e6ebf1; --muted: #8c99ab; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        background: var(--bg); color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { text-align: center; max-width: 32rem; }
      h1 { margin: 0 0 .5rem; font-size: 2rem; letter-spacing: -.02em; }
      p { margin: 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Tabler Charts</h1>
      <p>Zero-dependency SVG charts styled with CSS. Coming soon.</p>
    </main>
  </body>
</html>
