packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"

allowBuilds:
  # sass pulls in @parcel/watcher for its watch mode, which we never use.
  "@parcel/watcher": false
  # esbuild (used by the example frameworks) checks its platform binary on install.
  esbuild: true

overrides:
  # archiver > readdir-glob still pins minimatch 10, which has a ReDoS (GHSA-g3hv-75wg-m249).
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
