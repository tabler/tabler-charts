name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Validate packages
        run: pnpm lint:pkg

      # Typical imports bundled into .size/ and checked by Bundlewatch against
      # bundlewatch.config.cjs. Pull requests get a status comparing every size
      # with main once BUNDLEWATCH_GITHUB_TOKEN is set
      # (https://service.bundlewatch.io/setup-github).
      - name: Size budget
        run: pnpm size
        env:
          BUNDLEWATCH_GITHUB_TOKEN: ${{ secrets.BUNDLEWATCH_GITHUB_TOKEN }}
          CI_BRANCH_BASE: main

      # Real SSR builds (Next, Nuxt, Astro) against the packages built above.
      - name: Build SSR examples
        run: pnpm examples:build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          ASTRO_TELEMETRY_DISABLED: 1
