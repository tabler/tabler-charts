name: Release

# Versions and publishes the packages in packages/* with Changesets
# (https://github.com/changesets/changesets). Every pull request that changes
# a package adds a changeset in .changeset/ (`pnpm changeset`); the
# "Changesets" workflow comments on pull requests that forget one.
#
# On every push to main:
# - with changesets pending, `version` opens or updates the pull request
#   "chore: version packages", which applies them: one version for all five
#   packages (they are a fixed group in .changeset/config.json), CHANGELOG.md
#   in each package, and the changesets deleted;
# - once that pull request is merged, so nothing is pending and the versions
#   are not in npm yet, `pack` runs the full check and packs the tarballs,
#   and `publish` publishes them, creates the git tags
#   (@tabler/charts@X.Y.Z, one per package) and the GitHub releases.
#
# Publishing authenticates with npm trusted publishing: the publish job's
# OIDC token is exchanged by pnpm for a short-lived grant, so there is no npm
# token and no .npmrc. Each package on npmjs.com lists this repository and
# this file (release.yml) as its trusted publisher. The split into jobs keeps
# that token away from the build and the versioning.
#
# Pre-releases: `pnpm changeset pre enter alpha` (committed as
# .changeset/pre.json) makes every version from then on an alpha
# (0.1.0-alpha.0, alpha.1, ...); `pnpm changeset pre exit` ends it.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Open the version pull request
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The full history: `changeset version` looks up the commit that added
      # each changeset, and in a shallow clone it deepens it with `git fetch`,
      # which has no credentials here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/version@v2
        with:
          # Run without a shell, so the two commands live in one script.
          script: pnpm changeset:version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  pack:
    name: Check and pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, build, test, validate packages, size budget
        run: pnpm check

      # `pnpm pack` per package: it rewrites the workspace:^ ranges.
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
