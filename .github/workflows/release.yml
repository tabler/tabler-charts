name: Release

# Publishes every package in packages/* to npm when a release tag is pushed.
# `pnpm release` (release-it, see .release-it.json) bumps the versions,
# commits, tags vX.Y.Z and creates the GitHub release; this workflow does the
# publishing, so no npm credentials are needed anywhere. It checks the tag
# against the version in package.json, runs the same checks as CI and then
# publishes with provenance through npm trusted publishing: pnpm exchanges the
# workflow's OIDC token for a short-lived publish grant, so there is no npm
# token and no .npmrc. Each package on npmjs.com must list this repository
# and this workflow file (release.yml) as its trusted publisher. Trusted
# publishing cannot create a package, so the very first version of each
# package is published once by hand (see README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # The OIDC token is what authenticates the publish and signs the provenance.
  id-token: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A pre-release (0.0.1-alpha.0) is published under its identifier as the
      # npm dist-tag (alpha, beta, rc; "next" without one), so `latest` keeps
      # pointing at the last full release.
      - name: Check that the tag matches the version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi
          for pkg in packages/*/package.json; do
            v="$(node -p "require('./$pkg').version")"
            if [ "$v" != "$version" ]; then
              echo "::error::$pkg is at $v, expected $version"
              exit 1
            fi
          done
          case "$version" in
            *-*) suffix="${version#*-}"; dist_tag="${suffix%%[.0-9]*}"; dist_tag="${dist_tag:-next}" ;;
            *) dist_tag=latest ;;
          esac
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version as @$dist_tag"

      - name: Lint, typecheck, build, test, validate packages, size budget
        run: pnpm check

      # A tag checkout is a detached HEAD, which pnpm's git checks reject.
      - name: Publish
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks --provenance --tag "${{ steps.version.outputs.dist_tag }}"
