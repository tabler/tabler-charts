name: Visual

# Screenshots of the playground compared with the committed Linux baselines,
# in the Playwright image so fonts and rendering match from run to run.
# Run it by hand with "update snapshots" to (re)create every baseline after an
# intended visual change: they are uploaded as the `visual-baselines` artifact
# to commit (the summary of the run says how). Such a run compares nothing, so
# it has a name and a queue of its own: it is not the check of its commit, and
# it leaves the comparison of the same branch running.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Recreate every baseline and upload them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}-${{ inputs.update-snapshots && 'update' || 'compare' }}
  cancel-in-progress: true

jobs:
  visual:
    name: ${{ inputs.update-snapshots && 'Update baselines' || 'Visual regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Visual tests
        run: pnpm visual ${{ inputs.update-snapshots && '--update-snapshots=all' || '' }}
        env:
          # Firefox refuses to start as root with a HOME owned by another user.
          HOME: /root

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload new baselines
        if: always() && inputs.update-snapshots
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/linux/
          retention-days: 7

      - name: Say how to commit the new baselines
        if: always() && inputs.update-snapshots
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### New baselines, not committed yet

          This run recreated the Linux baselines and compared nothing. Until they are
          committed, the Visual check of this branch still uses the old ones:

          ```sh
          gh run download ${{ github.run_id }} -n visual-baselines -D tests/visual/__screenshots__/linux
          git add tests/visual/__screenshots__/linux
          git commit -m "test: update the Linux baselines"
          ```
          EOF
