name: Visual

# Screenshots of the playground compared with the committed Linux baselines,
# in the Playwright image so fonts and rendering match from run to run.
# Run it by hand with "update snapshots" to (re)create every baseline after an
# intended visual change: they are uploaded as the `visual-baselines` artifact
# to commit (the summary of the run says how). Such a run compares nothing, so
# it has a name and a queue of its own: it is not the check of its commit, and
# it leaves the comparison of the same branch running.
#
# Pushes and pull requests compare in Chromium only, without the leak checks
# (the slowest tests): a runner of a private repository has two cores, so
# Playwright runs one test at a time on it. Run it by hand with "full" for
# Firefox, WebKit and the leak checks too, split into jobs run side by side.
#
# Pushes and pull requests run it only when something that can change a
# screenshot changed: code, styles, markup, the baselines, dependencies or
# this file. Docs, changesets and the other workflows skip it.
on:
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.vue"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
      - "**/*.svg"
      - "tests/visual/**"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.vue"
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
      - "**/*.svg"
      - "tests/visual/**"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Recreate every baseline and upload them
        type: boolean
        default: false
      full:
        description: Also run Firefox, WebKit and the leak checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}-${{ inputs.update-snapshots && 'update' || inputs.full && 'full' || 'compare' }}
  cancel-in-progress: true

jobs:
  visual:
    name: >-
      ${{ inputs.update-snapshots && 'Update baselines'
        || inputs.full && format('Full visual regression ({0})', matrix.part.name)
        || 'Visual regression' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Updating makes every baseline (Firefox and WebKit have export ones)
        # in one job, so they land in one artifact. Chromium has most of the
        # slow tests, so a full run gives it three shards.
        part: >-
          ${{ fromJSON(inputs.update-snapshots && '[
            {"name": "all", "args": "--grep-invert @leaks"}
          ]' || inputs.full && '[
            {"name": "chromium 1/3", "args": "--project=chromium --shard=1/3"},
            {"name": "chromium 2/3", "args": "--project=chromium --shard=2/3"},
            {"name": "chromium 3/3", "args": "--project=chromium --shard=3/3"},
            {"name": "firefox", "args": "--project=firefox"},
            {"name": "webkit", "args": "--project=webkit"}
          ]' || '[
            {"name": "chromium", "args": "--project=chromium --grep-invert @leaks"}
          ]') }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Visual tests
        run: pnpm visual ${{ matrix.part.args }} ${{ inputs.update-snapshots && '--update-snapshots=all' || '' }}
        env:
          # Firefox refuses to start as root with a HOME owned by another user.
          HOME: /root

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload new baselines
        if: always() && inputs.update-snapshots
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/linux/
          retention-days: 7

      - name: Say how to commit the new baselines
        if: always() && inputs.update-snapshots
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### New baselines, not committed yet

          This run recreated the Linux baselines and compared nothing. Until they are
          committed, the Visual check of this branch still uses the old ones:

          ```sh
          gh run download ${{ github.run_id }} -n visual-baselines -D tests/visual/__screenshots__/linux
          git add tests/visual/__screenshots__/linux
          git commit -m "test: update the Linux baselines"
          ```
          EOF
